topics:
  - id: "topic-001"
    topic: "西瓜为什么不用来制糖"
    category: "自然机制"
    expected_characteristics:
      - 含糖量对比
      - 单位土地成本
      - 糖分组成与结晶
    source_facts:
      - "西瓜含糖量约 6-8%"
      - "甘蔗含糖量约 13-15%"
      - "西瓜亩产约 3000 公斤"

  - id: "topic-002"
    topic: "台风眼为什么风平浪静"
    category: "自然机制"
    expected_characteristics:
      - 科里奥利力
      - 眼壁与下沉气流
      - 气压差
    source_facts:
      - "台风眼直径通常 30-65 公里"
      - "台风中心气压最低"

  - id: "topic-003"
    topic: "为什么海水是咸的"
    category: "自然机制"
    expected_characteristics:
      - 岩石风化
      - 硫化物氧化
      - 蒸发-降水循环
    source_facts:
      - "海水盐度约 35‰"
      - "每年约 4 亿吨盐分进入海洋"

  - id: "topic-004"
    topic: "为什么山峰高度有限"
    category: "自然机制"
    expected_characteristics:
      - 重力与岩石强度
      - 侵蚀速率
      - 岩石强度极限
    source_facts:
      - "珠穆朗玛峰 8848.86 米"
      - "火星奥林帕斯山约 21 公里"

  - id: "topic-005"
    topic: "雷电为何先看到后听到"
    category: "自然机制"
    expected_characteristics:
      - 光速与声速
      - 估算距离
      - 折射与反射
    source_facts:
      - "光速约 30 万公里/秒"
      - "声速约 340 米/秒"

  - id: "topic-006"
    topic: "影子为什么有时比物体长有时短"
    category: "日常疑问"
    expected_characteristics:
      - 太阳高度角
      - 投影几何
      - 日晷基本原理
    source_facts:
      - "正午影子最短"
      - "日出日落时长"

  - id: "topic-007"
    topic: "冰块为什么浮在水面上"
    category: "日常疑问"
    expected_characteristics:
      - 氢键与晶体结构
      - 密度差异
      - 反膨胀
    source_facts:
      - "冰密度约 0.917 g/cm³"
      - "水密度约 1 g/cm³"

  - id: "topic-008"
    topic: "为什么切洋葱会让人流泪"
    category: "日常疑问"
    expected_characteristics:
      - 硫代丙醛-S-氧化物
      - 酶反应
      - 防御机制
    source_facts:
      - "催泪因子释放时间 30 秒"

  - id: "topic-009"
    topic: "为什么咖啡喝多了会心悸"
    category: "日常疑问"
    expected_characteristics:
      - 咖啡因半衰期
      - 腺苷受体拮抗
      - 肾上腺素释放
    source_facts:
      - "咖啡因半衰期约 5 小时"
      - "一杯咖啡约含 80-100mg 咖啡因"

  - id: "topic-010"
    topic: "为什么金属会有不同的颜色"
    category: "日常疑问"
    expected_characteristics:
      - 电子跃迁
      - 选择性吸收
      - d 轨道
