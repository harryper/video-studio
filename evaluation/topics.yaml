      - "金的 d-d 跃迁导致蓝紫吸收"

  - id: "topic-011"
    topic: "古罗马人为什么不刷牙"
    category: "历史调查"
    expected_characteristics:
      - 罗马饮食习惯
      - 糖的稀有性
      - 牙科史
    source_facts:
      - "罗马人用尿美白牙齿"

  - id: "topic-012"
