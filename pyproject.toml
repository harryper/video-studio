[project]
name = "content-studio"
version = "0.1.0"
description = "Content Studio API and worker runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "sqlalchemy==2.0.51",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
